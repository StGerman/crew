[workspace]
members = [".", "libcrew", "crewctl"]
# A plain `cargo test`, `cargo clippy` and `cargo build` cover every package, not only the root
# one, so the commit gate and CI keep checking the client and the shared library too.
default-members = [".", "libcrew", "crewctl"]
resolver = "3"

[package]
name = "crewd"
version = "0.1.0"
edition = "2024"

# `use crew::` rather than `use crewd::`: the daemon, the client and the shared library read as
# three parts of one suite (#45).
[lib]
name = "crew"

[dependencies]
libcrew = { path = "libcrew" }
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
libc = "0.2.189"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["parsing"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "io-util"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.4.2"

[dev-dependencies]
insta = "1.48.0"
