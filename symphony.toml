# Development config: fake tracker, simulated workers, fast tick so the dashboard moves.

[tracker]
kind = "fake"
active_states = ["In Progress", "In Review"]
terminal_states = ["Done", "Cancelled"]
required_labels = ["agent"]

[polling]
interval_ms = 2000

[workspace]
root = ".symphony/workspaces"

[agent]
max_concurrent = 3
max_turns_per_session = 20
# The cross-session budget. `max_turns_per_session` alone cannot bound an issue, because each
# continuation starts a fresh session with its own allowance.
max_turns_per_issue = 40
max_retry_backoff_ms = 60000
stall_timeout_ms = 15000
quarantine_after_identical = 3
refresh_miss_grace = 2
# How often finished (parked) issues are re-read to see whether their ticket has closed, so the
# worktree can be reclaimed. Slower than the poll on purpose: a parked issue is not urgent, and
# each sweep costs one tracker read per issue still parked. 0 disables the sweep.
parked_sweep_interval_ms = 60000

# Cap a busy state independently of the global limit.
[agent.max_concurrent_by_state]
"in review" = 1

# Host-side tracker tools for the agent (src/broker/). The demo tracker has nothing to write
# to, so calls are recorded and dropped — which still exercises scoping, budgets and the audit
# log without a network.
[broker]
enabled = true
max_calls_per_run = 20
# Across *all* of an issue's runs. The per-run cap alone bounds nothing, because every
# continuation opens a fresh run with a fresh allowance.
max_calls_per_issue = 100
# The ops HTTP surface, off unless asked for — `--api 127.0.0.1:8787` flips it for one run
# without editing this file. `POST /refresh` and `POST /unquarantine` control agent execution,
# so a non-loopback `bind` additionally needs `allow_public = true`.
#
# `bind` is also where `symphony-cc status` looks, so a client run from this directory needs no
# address of its own. Turning `enabled` on is what makes that work: with it off there is nothing
# listening, and `status` says so rather than guessing the daemon is down.
[api]
enabled = false
bind = "127.0.0.1:8787"

# Per-run transcripts of the agent's raw event stream (src/transcript.rs). Defaults to
# `.transcripts` under the workspace root — beside the worktrees, never inside one, because a
# worktree is deleted when its ticket goes terminal.
[transcripts]
enabled = true
max_bytes_per_run = 8388608
keep_runs = 100
