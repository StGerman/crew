# The commit gate, run by a machine instead of by whoever remembers.
#
# `cargo fmt --check`, `cargo clippy --all-targets -- -D warnings` and `cargo test` are the
# standing bar in CLAUDE.md, and until this file existed nothing enforced them. That was
# defensible while one person wrote every commit; it stopped being defensible once dispatched
# agents started leaving branches behind, because "someone ran it locally" then has nobody to
# name. So `push` here is deliberately unfiltered: a pushed agent branch with no pull request
# yet is exactly the case this job exists for.
#
# The suite is unusually well suited to a runner and that is not an accident. Time only moves
# when a test moves it (`FakeClock`), every external seam has a fake, and there are no sleeps
# anywhere -- the properties that make `tests/scheduler.rs` worth having are the same ones
# that make it non-flaky here. 143 tests, about two seconds.
#
# ---------------------------------------------------------------------------------------
# DO NOT MAKE THIS JOB RUN AN EXAMPLE.
#
# `examples/broker_live.rs` drives a real `claude` binary against a real broker: it spawns a
# tool-using agent process and spends tokens. The only thing standing between this runner and
# that is a Cargo default -- example targets are `test = false`, so every cargo *test* verb
# (`cargo test`, `--all-targets`, even `--examples`) compiles them and never calls `main`.
# Compiling them is the point; running one is the accident. `cargo run --example` is what
# crosses the line, so it must never appear in this file.
#
# That property is load-bearing and invisible, which is why it is written here rather than
# left to be rediscovered.
# ---------------------------------------------------------------------------------------

name: CI

on:
  push:
  pull_request:

# Keyed on the full `github.ref` rather than the branch name, so a push run and a pull-request
# run for the same branch sit in different groups and cannot cancel each other. They overlap
# and that is fine -- a cancelled run reports as neither pass nor fail, and a required check
# stuck in that state would block a merge for no reason. Duplicated seconds are the cheaper
# mistake. Successive pushes to one ref still supersede each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    # The suite finishes in seconds; anything near this limit is hung, not slow.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No setup-toolchain action on purpose: `rust-toolchain.toml` is the single pin and
      # rustup honours it on the first cargo invocation. Two places to state a version is one
      # place for them to drift apart. This step forces that install to happen before the
      # cache step, which keys on `rustc -vV`, and leaves the resolved version in the log so
      # "which toolchain ran" is answerable from the run alone.
      - name: Resolve pinned toolchain
        run: |
          # `cargo --version` goes first and is doing real work: it is the rustup proxy, and
          # invoking it is what installs the toolchain the pin names. `rustup show` is not a
          # substitute -- since rustup 1.28 it reports without installing, so asking it first
          # on a clean runner fails on a toolchain nothing has fetched yet.
          cargo --version
          rustup show active-toolchain
          cargo clippy --version
          cargo fmt --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Every gate reports even when an earlier one fails. The job still fails -- this only
      # decides how much you learn per run, and the whole premise of this file is that people
      # skip gates they have to run three times to get three answers out of.
      - name: cargo fmt --check
        if: ${{ !cancelled() }}
        run: cargo fmt --check

      # `--locked` so a drifted Cargo.lock fails the job instead of being quietly updated.
      - name: cargo clippy --all-targets -- -D warnings
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        if: ${{ !cancelled() }}
        run: cargo test --locked
