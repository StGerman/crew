# Points at this repo's own real GitHub Issues backlog. Requires GITHUB_TOKEN in the
# environment — never put a token in this file, it is checked in.
#
# The backlog has not adopted the `state:<name>` label convention yet (see
# src/tracker/github.rs's module doc), so every open, `agent`-labelled issue reports as
# state "open" — active_states reflects that rather than inventing labels that do not exist.
# Once issues start carrying `state:*` labels, active_states/terminal_states should switch to
# that vocabulary instead.

[tracker]
kind = "github"
owner = "StGerman"
repo = "symphony-cc"
active_states = ["open"]
terminal_states = ["closed"]
required_labels = ["agent"]

# 30s at max_concurrent = 2 is (1 + 2) requests per poll * 120 polls/hour = 360/hour, well
# under the 5000/hour authenticated budget — see the rate-limit budget math in
# src/tracker/github.rs's module doc before tightening this.
[polling]
interval_ms = 30000

[workspace]
root = ".symphony/workspaces"
repo = "."

# Live dispatch: real `claude -p` processes, with `--permission-mode bypassPermissions`, against
# real git worktrees. Flipping this is the separate, deliberate decision `WorkerConfig`'s doc
# describes — a real tracker on its own only watches; this is what turns watching into working.
[worker]
kind = "claude"

[agent]
# Two real agents means two rust-analyzer indexes and two `cargo check`s on one machine —
# budget 1-2 GB resident each. Worth it once the single-agent path is proven: the wall clock of
# a dispatch is the agent's, not the orchestrator's, so the second one is close to free in time.
max_concurrent = 2
# Budgets sized for a real agent rather than for the fake worker. A turn is one `assistant`
# event, so a slice of work runs to dozens of them; at 20 the session was cut every 20 tool
# calls, and at 40 cumulative the issue quarantined before the work could land.
max_turns_per_session = 40
max_turns_per_issue = 200
max_retry_backoff_ms = 60000
# 15s was a fake-worker number. Progress only advances on `assistant` events, so one long tool
# call — a cold `cargo check`, a rust-analyzer index — is indistinguishable from a stalled
# agent; at 15s the scheduler kills a working agent mid-build and quarantines it after three.
stall_timeout_ms = 300000
quarantine_after_identical = 3
refresh_miss_grace = 2
# Parked issues — finished, but not yet closed on GitHub — are re-read once per interval so a
# worktree can be reclaimed when its issue closes. Each sweep is one request per parked issue,
# so at 5 minutes this adds 12 * (parked issues) requests per hour on top of the poll budget
# above; parked issues stop being swept once their worktree is reclaimed.
parked_sweep_interval_ms = 300000

# Host-side tracker tools. These writes are real: comments land on the issue, and `set_state`
# rewrites its `state:*` label and open/closed flag. The credential stays in this process — the
# agent gets a per-run token scoped to the one issue it was dispatched for, and never a token
# for GitHub itself.
#
# `set_state` costs three requests (read labels, replace labels, set the flag) against the
# rate-limit budget in src/tracker/github.rs's module doc, so it is worth keeping the per-run
# cap tight enough that a confused agent cannot spend the poll budget on label churn.
[broker]
enabled = true
max_calls_per_run = 10
max_calls_per_issue = 40

# Inspect a headless run without attaching a terminal. `status` reads `bind` out of this file,
# so neither command needs the port repeated to it:
#   symphony-cc --config symphony.github.toml status
#   symphony-cc --config symphony.github.toml status 24
[api]
enabled = true
bind = "127.0.0.1:8787"
# Per-run transcripts (src/transcript.rs). Worth more here than against the demo tracker: this
# is the config that dispatches real agents, and the run you need to explain afterwards is the
# one whose scrollback is already gone. `stall_timeout_ms` above means a wedged run can sit in
# `keep_runs` for a long time — retention never deletes a live run's own file, so a low bound
# costs finished runs, not the one being diagnosed.
[transcripts]
enabled = true
max_bytes_per_run = 8388608
keep_runs = 50
